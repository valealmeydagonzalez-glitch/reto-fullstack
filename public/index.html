<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Gestor Full Stack</title>
    <!-- Librería para el confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.6s ease;
        }

        body.in-app {
            background: linear-gradient(135deg, #f43f5e 0%, #8b5cf6 50%, #06b6d4 100%);
            background-size: 200% 200%;
            animation: gradientMove 10s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .wrapper {
            width: 100%;
            max-width: 560px;
        }

        .container {
            background: var(--card-bg);
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            animation: bounceInEnter 0.9s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards;
            transition: all 0.4s ease;
        }

        @keyframes bounceInEnter {
            0% { transform: scale(0) translateY(-200px) rotate(-15deg); opacity: 0; }
            60% { transform: scale(1.05) translateY(15px) rotate(3deg); opacity: 1; }
            80% { transform: scale(0.95) translateY(-5px) rotate(-1deg); }
            100% { transform: scale(1) translateY(0) rotate(0deg); opacity: 1; }
        }

        .container.goodbye-animation {
            animation: byeBye 0.7s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards;
        }

        @keyframes byeBye {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.15) rotate(5deg); background: #fef08a; }
            100% { transform: scale(0) rotate(-360deg); opacity: 0; }
        }

        .auth-form-animated {
            animation: formMorph 0.45s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes formMorph {
            0% { transform: translateY(20px) scale(0.97); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-header h2 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            color: var(--text-main);
        }

        .auth-header p {
            margin: 8px 0 0 0;
            font-size: 14px;
            color: var(--text-muted);
        }

        .auth-tabs {
            display: flex;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .tab-btn.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transform: scale(1.02);
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.2s ease;
            background: #f8fafc;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 13px;
            width: 100%;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
        }

        .app-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 12px;
        }

        .app-header-flex h2 {
            margin: 0;
            font-size: 22px;
            color: #4f46e5;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #congrats-banner {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 12px;
            display: none;
            animation: popIn 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .task-card {
            background: #f8fafc;
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 14px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slideIn 0.3s ease forwards;
        }

        .task-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            border-color: #cbd5e1;
        }

        .task-card.completed {
            background: #ecfdf5;
            border-color: #a7f3d0;
        }

        .task-card.completed .task-title {
            text-decoration: line-through;
            color: #047857;
        }

        .task-card.completed .task-desc {
            color: #065f46;
            opacity: 0.8;
        }

        .task-card.deleting {
            animation: fadeOutSlide 0.35s ease forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeOutSlide {
            to { opacity: 0; transform: translateX(50px) scale(0.95); }
        }

        .task-left {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            flex: 1;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            margin-top: 3px;
            cursor: pointer;
            accent-color: var(--success);
        }

        .task-info {
            flex: 1;
        }

        .task-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            transition: color 0.2s;
        }

        .task-desc {
            margin: 4px 0 6px 0;
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .priority-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
        }
        .priority-alta { background: #fee2e2; color: #dc2626; }
        .priority-media { background: #fef3c7; color: #d97706; }
        .priority-baja { background: #e0f2fe; color: #0284c7; }

        .task-actions {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: flex-end;
            margin-left: 10px;
        }

        .task-buttons-row {
            display: flex;
            gap: 4px;
        }

        .task-actions button, .move-btn {
            border: none;
            padding: 5px 8px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-move { background: #e2e8f0; color: #334155; font-weight: bold; }
        .btn-move:hover { background: #cbd5e1; transform: scale(1.05); }

        .btn-edit { background: #fef3c7; color: var(--warning); }
        .btn-edit:hover { background: var(--warning); color: white; transform: scale(1.05); }

        .btn-delete { background: #fee2e2; color: var(--danger); }
        .btn-delete:hover { background: var(--danger); color: white; transform: scale(1.05); }

        .btn-logout {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            background: #fee2e2;
            color: var(--danger);
            border-color: #fecaca;
            transform: scale(1.05);
        }

        .hidden { display: none !important; }
        
        #tasks-container {
            max-height: 350px;
            overflow-y: auto;
            margin-top: 10px;
            padding-right: 4px;
        }

        .btn-cancel {
            background: #e2e8f0;
            color: var(--text-main);
            margin-top: 8px;
            display: none;
        }
        .btn-cancel:hover { background: #cbd5e1; }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="container" id="main-container">
            
            <!-- SECCIÓN DE AUTENTICACIÓN -->
            <div id="auth-section">
                <div class="auth-header">
                    <h2 id="auth-title">¡Bienvenido de nuevo!</h2>
                    <p id="auth-subtitle">Ingresa tus credenciales para administrar tus tareas</p>
                </div>

                <div class="auth-tabs">
                    <button type="button" class="tab-btn active" id="tab-login" onclick="cambiarTab(false)">Iniciar Sesión</button>
                    <button type="button" class="tab-btn" id="tab-register" onclick="cambiarTab(true)">Registrarse</button>
                </div>

                <div id="auth-form-container" class="auth-form-animated">
                    <div class="input-group">
                        <label>Correo Electrónico</label>
                        <input type="email" id="email" placeholder="tucorreo@ejemplo.com" required>
                    </div>
                    <div class="input-group">
                        <label>Contraseña</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    <button type="button" id="auth-btn" class="btn-primary" onclick="manejarAuth()">Ingresar</button>
                </div>
            </div>

            <!-- SECCIÓN DE LA APLICACIÓN -->
            <div id="app-section" class="hidden">
                <div class="app-header-flex">
                    <h2>🌟 Mi Panel Pro</h2>
                    <button type="button" class="btn-logout" onclick="cerrarSesionConEstilo()">Cerrar Sesión 🚪</button>
                </div>

                <div id="congrats-banner">
                    🎉 ¡Increíble trabajo! Has completado todas tus tareas pendientes. ¡Eres imparable! 🚀
                </div>

                <form id="task-form" onsubmit="guardarTarea(event)" style="margin-top: 10px;">
                    <input type="hidden" id="editing-task-id" value="">
                    <input type="hidden" id="editing-task-completed" value="0">
                    
                    <div class="input-group">
                        <input type="text" id="task-title" placeholder="¿Qué tarea increíble harás hoy?" required>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <div class="input-group" style="flex: 2; margin-bottom: 0;">
                            <textarea id="task-desc" placeholder="Detalles..." rows="1" style="height: 45px; resize: none;"></textarea>
                        </div>
                        <div class="input-group" style="flex: 1; margin-bottom: 0;">
                            <select id="task-priority">
                                <option value="baja">Baja 🟢</option>
                                <option value="media" selected>Media 🟡</option>
                                <option value="alta">Alta 🔴</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" id="task-submit-btn" class="btn-primary" style="margin-top: 12px;">Añadir Tarea</button>
                    <button type="button" id="task-cancel-btn" class="btn-primary btn-cancel" onclick="cancelarEdicion()">Cancelar Edición</button>
                </form>

                <div id="tasks-container"></div>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
    <script>
        function cambiarTab(registrarse) {
            isRegistering = registrarse;
            reproducirSonido('click');

            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const authTitle = document.getElementById('auth-title');
            const authSubtitle = document.getElementById('auth-subtitle');
            const authBtn = document.getElementById('auth-btn');
            const formContainer = document.getElementById('auth-form-container');

            formContainer.classList.remove('auth-form-animated');
            void formContainer.offsetWidth;
            formContainer.classList.add('auth-form-animated');

            if (isRegistering) {
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
                authTitle.textContent = 'Crea tu cuenta 🚀';
                authSubtitle.textContent = 'Regístrate para empezar a organizar tus pendientes';
                authBtn.textContent = 'Registrarse';
                authBtn.style.background = '#10b981';
            } else {
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                authTitle.textContent = '¡Bienvenido de nuevo! 👋';
                authSubtitle.textContent = 'Ingresa tus credenciales para administrar tus tareas';
                authBtn.textContent = 'Ingresar';
                authBtn.style.background = '#6366f1';
            }
        }
    </script>
</body>
</html>
